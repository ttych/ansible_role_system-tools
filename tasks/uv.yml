---

- block:

    - name: check current uv
      ansible.builtin.stat:
        path: "{{ system_tools_uv_local_bin }}"
      register: t_system_tools_uv_local_bin

    - block:

        - name: get latest uv version from GitHub API
          ansible.builtin.uri:
            url: "{{ system_tools_uv_github_api_url }}"
            return_content: yes
          register: t_system_tools_uv_github_latest_release
          changed_when: no

        - name: extract latest uv version
          ansible.builtin.set_fact:
            system_tools_uv_version: "{{ (t_system_tools_uv_github_latest_release.content | from_json).tag_name | replace('v', '') }}"

      when: system_tools_uv_version is not defined or system_tools_uv_version == ""

    - block:

        - name: get current uv version
          ansible.builtin.shell:
            cmd: "{{ system_tools_uv_local_bin }} --version | sed -n 's/^uv\\s\\([0-9.]*\\)\\s.*$/\\1/p'"
          register: t_system_tools_uv_current_version
          changed_when: no

      when: t_system_tools_uv_local_bin.stat.exists

    - debug:
        msg: "latest:{{ system_tools_uv_version }}  -  current:{{ t_system_tools_uv_current_version.stdout | d('') }}"

    - block:

        - name: download uv archive
          ansible.builtin.get_url:
            url: "{{ system_tools_uv_github_download_url }}"
            dest: "{{ system_tmp_dir }}/{{ system_tools_uv_github_archive }}"
            mode: '0644'

        - name: extract uv archive
          ansible.builtin.unarchive:
            src: "{{ system_tmp_dir }}/{{ system_tools_uv_github_archive }}"
            dest: "{{ system_tmp_dir }}"
            remote_src: yes
            creates: "{{ system_tmp_dir }}/{{ system_tools_uv_name }}"

        - name: "install uv binary to {{ system_tools_uv_local_bin }}"
          ansible.builtin.copy:
            src: "{{ system_tmp_dir }}/{{ system_tools_uv_github_archive_name }}/{{ system_tools_uv_name }}"
            dest: "{{ system_tools_uv_local_bin }}"
            mode: '0755'
            owner: root
            group: root
            remote_src: yes

        - name: "install uvx binary to {{ system_tools_uv_local_bin }}"
          ansible.builtin.copy:
            src: "{{ system_tmp_dir }}/{{ system_tools_uv_github_archive_name }}/uvx"
            dest: "{{ system_tools_uvx_local_bin }}"
            mode: '0755'
            owner: root
            group: root
            remote_src: yes

        - name: clean up temporary files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ system_tmp_dir }}/{{ system_tools_uv_github_archive }}"
            - "{{ system_tmp_dir }}/{{ system_tools_uv_github_archive_name }}"

      when: not t_system_tools_uv_local_bin.stat.exists or (t_system_tools_uv_current_version is defined and t_system_tools_uv_current_version.stdout != system_tools_uv_version)

  when: want_system_tools_uv
